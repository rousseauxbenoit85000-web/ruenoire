var T = 64, NB = 27, N = NB * 8, WORLD = N * T, CB0 = 5, CB1 = 13, CC = 9, RING0 = 2, RING1 = 17;

function genMap() {

    }

    detail[ty * N + tx] = Math.floor(R() * 256);
  }
  // mer, plages et îles
  var ISL = [[196, 70, 9], [150, 198, 6]];
  for (ty = 0; ty < N; ty++) for (tx = 0; tx < N; tx++) {
    var cxs = coastX(ty), cys = coastY(tx), k0 = ty * N + tx;
    if (tx > cxs || ty > cys) map[k0] = G_SEA;
    else if (tx > cxs - 3 || ty > cys - 3) map[k0] = G_SAND;
    ISL.forEach(function (il) { var dd = Math.hypot(tx - il[0], ty - il[1]); if (dd < il[2]) map[k0] = dd < il[2] - 2.5 ? G_GRASS : G_SAND; });
  }

  map[70 * N + 196] = G_BLD; buildings.push({ x: 196 * T, y: 70 * T, w: T, h: T, col: '#fff', hgt: 10, bank: false, s: 7, preset: 'lighthouse' });
  // route vers le port (dans l'axe du centre-ville)
  var my = CC * 8, cEnd = coastX(my) - 3;
  for (tx = RING1 * 8 + 2; tx < cEnd; tx++) { map[my * N + tx] = G_ROAD; map[(my + 1) * N + tx] = G_ROAD; }
  // route de la côte (corniche) à l'est et au sud + liaisons avec le périphérique
  var CR = 20 * 8;
  function rd(x0, y0, x1, y1) { for (var yy = y0; yy <= y1; yy++) for (var xx = x0; xx <= x1; xx++) if (xx >= 0 && yy >= 0 && xx < N && yy < N && map[yy * N + xx] !== G_SEA) map[yy * N + xx] = G_ROAD; }
  rd(CR, RING0 * 8, CR + 1, CR + 1); rd(RING0 * 8, CR, CR + 1, CR + 1);

  rd(CC * 8, RING1 * 8 + 2, CC * 8 + 1, CR - 1);
  var pierY = my + 4, pierX0 = coastX(pierY) - 2;
  for (tx = pierX0; tx < pierX0 + 9; tx++) map[pierY * N + tx] = G_DOCK;
  for (ty = my + 2; ty < pierY; ty++) for (tx = cEnd - 2; tx < pierX0 + 1; tx++) if (map[ty * N + tx] !== G_SEA) map[ty * N + tx] = G_SAND;
  MARINA.x = (pierX0 + 1) * T; MARINA.y = (pierY + 0.5) * T; MARINA.px0 = pierX0; MARINA.py = pierY;
  for (var bq = 0; bq < 4; bq++) boatSpots.push({ x: (pierX0 + 3 + bq * 1.6) * T, y: (pierY - 0.25) * T, a: 0 });
  // aéroport au nord du centre-ville (on retire la radiale nord à cet endroit)
  for (ty = AIRPORT.y0; ty <= AIRPORT.y1; ty++) for (tx = AIRPORT.x0; tx <= AIRPORT.x1; tx++) map[ty * N + tx] = G_AIR;
  [[60, 35, 20, 4, 'terminal'], [84, 35, 1, 1, 'tower'], [88, 34, 5, 4, 'hangar'], [94, 34, 5, 4, 'hangar']].forEach(function (q) {

    for (var jj = 0; jj < q[3]; jj++) for (var ii = 0; ii < q[2]; ii++) map[(q[1] + jj) * N + q[0] + ii] = G_BLD;

  for (by = CB0; by <= CB1; by++) for (bx = CB0; bx <= CB1; bx++) {
    var ox = bx * 8 + 3, oy = by * 8 + 3, role;
    if (bx === CC && by === CC) role = 'plaza';
    else if (bx === CC + 1 && by === CC) { R(); role = 'tower'; }
    else if (bx === CB0 + 1 && by === CB0 + 1) role = 'bank';
    else if (bx === CB1 - 1 && by === CB1 - 1) role = 'garage';
    else { var r = R(); role = r < 0.58 ? 'bld' : r < 0.72 ? 'park' : r < 0.86 ? 'lot' : 'plaza'; }
    var i, j;
    if (role === 'tower') {
      buildings.push({ x: ox * T, y: oy * T, w: 4 * T, h: 4 * T, col: '#1d3b5c', hgt: 10, bank: false, s: 77, preset: 'dsn' });
      for (j = 0; j < 4; j++) for (i = 0; i < 4; i++) map[(oy + j) * N + ox + i] = G_BLD;
      DSN.x = (ox + 2) * T; DSN.y = (oy + 2) * T;
    } else if (role === 'bld' || role === 'bank') {
      var rects = [];
      (function cut(x, y, w, h, d) {
        var a = w * h, stop = a >= 12 ? 0.12 : a >= 6 ? 0.35 : a >= 3 ? 0.55 : 0.8;
        if (role === 'bank' || a <= 1 || (d > 0 && R() < stop)) { rects.push([x, y, w, h]); return; }
        var vert = w > h ? true : w < h ? false : R() < 0.5, len = vert ? w : h, k = 1 + Math.floor(R() * (len - 1));
        if (vert) { cut(x, y, k, h, d + 1); cut(x + k, y, w - k, h, d + 1); } else { cut(x, y, w, k, d + 1); cut(x, y + k, w, h - k, d + 1); }
      })(0, 0, 4, 4, 0);
      rects.forEach(function (q) {

        for (j = 0; j < q[3]; j++) for (i = 0; i < q[2]; i++) map[(oy + q[1] + j) * N + (ox + q[0] + i)] = G_BLD;
      });
      if (role === 'bank') { BANK.x = (ox + 2) * T; BANK.y = (by * 8 + 7.5) * T; }
    } else if (role === 'park') {
      var pond = R() < 0.6;
      for (j = 0; j < 4; j++) for (i = 0; i < 4; i++) { var mid = (i === 1 || i === 2) && (j === 1 || j === 2); map[(oy + j) * N + ox + i] = mid ? (pond ? G_WATER : G_GRASS) : (R() < 0.28 ? G_TREE : G_GRASS); }
      if (pond) ponds.push({ x: (ox + 2) * T, y: (oy + 2) * T, r: 60 });
    } else if (role === 'lot' || role === 'garage') {
      for (j = 0; j < 4; j++) for (i = 0; i < 4; i++) {
        map[(oy + j) * N + ox + i] = G_LOT;
        if (j === 0 || j === 3) lotSpots.push({ x: (ox + i + 0.5) * T, y: (oy + j + 0.5) * T, a: j === 0 ? Math.PI / 2 : -Math.PI / 2 });
      }
      if (role === 'garage') { GARAGE.x = (ox + 2) * T; GARAGE.y = (oy + 2) * T; }
    } else if (role === 'plaza') {
      if (bx === CC && by === CC) { HOSPITAL.x = (ox + 2) * T; HOSPITAL.y = (oy + 2) * T; for (j = 0; j < 4; j++) for (i = 0; i < 4; i++) detail[(oy + j) * N + ox + i] = 255; }
    }

  function freeT(tx2, ty2) { return tx2 > 0 && ty2 > 0 && tx2 < N - 1 && ty2 < N - 1 && map[ty2 * N + tx2] === G_GRASS && !nearRoad(tx2, ty2); }
  for (by = 0; by < NB; by++) for (bx = 0; bx < NB; bx++) {
    if (bx >= CB0 && bx <= CB1 && by >= CB0 && by <= CB1) continue;
    var r2 = R(), kind = r2 < 0.3 ? 'field' : r2 < 0.52 ? 'forest' : r2 < 0.7 ? 'pasture' : r2 < 0.8 ? 'farm' : r2 < 0.88 ? 'lake' : 'meadow', x0 = bx * 8, y0 = by * 8;
    if (kind === 'farm') { var ok = true; for (j = 1; j < 7; j++) for (i = 1; i < 7; i++) if (!freeT(x0 + i, y0 + j)) ok = false; if (!ok) kind = 'field'; }
    if (kind === 'lake') { var ok2 = true; for (j = 2; j < 6; j++) for (i = 2; i < 6; i++) if (!freeT(x0 + i, y0 + j)) ok2 = false; if (!ok2) kind = 'meadow'; }
    var cp = Math.floor(R() * 4), pst = null;
    if (kind === 'pasture') { pst = { x0: 99999, y0: 99999, x1: -1, y1: -1 }; pastures.push(pst); }

      if (kind === 'field' || (kind === 'farm' && (i < 2 || i > 5 || j > 5))) { map[k3] = G_FIELD; crop[k3] = cp; }
      else if (kind === 'forest') { if (R() < 0.42) map[k3] = G_TREE; }
      else if (kind === 'meadow') { if (R() < 0.07) map[k3] = G_TREE; }
      else if (kind === 'pasture') { pastureT[k3] = 1; pastureSpots.push({ x: (tx3 + 0.5) * T, y: (ty3 + 0.5) * T }); pst.x0 = Math.min(pst.x0, tx3); pst.y0 = Math.min(pst.y0, ty3); pst.x1 = Math.max(pst.x1, tx3); pst.y1 = Math.max(pst.y1, ty3); }

        for (var jj = 0; jj < q[3]; jj++) for (var ii = 0; ii < q[2]; ii++) map[(y0 + q[1] + jj) * N + x0 + q[0] + ii] = G_BLD;
      });
    }
    if (kind === 'lake') { for (j = 2; j < 6; j++) for (i = 2; i < 6; i++) map[(y0 + j) * N + x0 + i] = G_WATER; ponds.push({ x: (x0 + 4) * T, y: (y0 + 4) * T, r: 118 }); }
  }
