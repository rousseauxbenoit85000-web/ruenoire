<!DOCTYPE html>
<html lang="fr">

<title>Rue Noire</title>
<style>
html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
canvas { display: block; position: fixed; touch-action: none; left: env(safe-area-inset-left, 0px); top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
</style>

<body>
<canvas id="g"></canvas>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';

/* =====================================================================
   RUE NOIRE — jeu d'arcade en vue de dessus (original).
   Ville procédurale, voitures, piétons, police, missions. Tout est dessiné
   en code, les sons sont synthétisés : aucun fichier externe.
   ===================================================================== */

var gb = document.getElementById('g');
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.75);
  W = cv.clientWidth || window.innerWidth; H = cv.clientHeight || window.innerHeight;
  cv.width = gb.width = Math.round(W * DPR); cv.height = gb.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize); window.addEventListener('orientationchange', function () { setTimeout(function () { resize(); layoutUI && layoutUI(); }, 300); }); resize();

/* ---------- utilitaires ---------- */
var TAU = Math.PI * 2;
function rnd(a, b) { return a + Math.random() * (b - a); }
function ri(a, b) { return Math.floor(rnd(a, b + 1)); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function wrap(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function money(n) { return '$ ' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

/* ---------- monde ---------- */
var T = 64, NB = 7, N = NB * 8, WORLD = N * T;
var G_ROAD = 0, G_WALK = 1, G_BLD = 2, G_GRASS = 3, G_TREE = 4, G_LOT = 5;
var map = new Uint8Array(N * N);
var detail = new Uint8Array(N * N);
var buildings = [], lotSpots = [], walkSpots = [];
var GARAGE = { x: 0, y: 0 }, BANK = { x: 0, y: 0 }, HOSPITAL = { x: 0, y: 0 };
var ROOFS = ['#8a5a44', '#6d7a8a', '#9a8f7c', '#5f6f63', '#7a5f7a', '#a0675a', '#6a7d96', '#8c8c8c'];

function tileAt(tx, ty) { if (tx < 0 || ty < 0 || tx >= N || ty >= N) return G_BLD; return map[ty * N + tx]; }
function solidTile(t) { return t === G_BLD || t === G_TREE; }

function genMap() {
  var R = mulberry(20261121), tx, ty, bx, by;
  for (ty = 0; ty < N; ty++) for (tx = 0; tx < N; tx++) {
    var ix = tx % 8, iy = ty % 8, t;
    if (ix < 2 || iy < 2) t = G_ROAD;
    else if (ix === 2 || ix === 7 || iy === 2 || iy === 7) t = G_WALK;
    else t = G_WALK;
    map[ty * N + tx] = t;
    detail[ty * N + tx] = Math.floor(R() * 256);
  }
  for (by = 0; by < NB; by++) for (bx = 0; bx < NB; bx++) {
    var ox = bx * 8 + 3, oy = by * 8 + 3, role;
    if (bx === 3 && by === 3) role = 'plaza';
    else if (bx === 1 && by === 1) role = 'bank';
    else if (bx === 5 && by === 5) role = 'garage';
    else { var r = R(); role = r < 0.58 ? 'bld' : r < 0.72 ? 'park' : r < 0.86 ? 'lot' : 'plaza'; }
    var i, j;
    if (role === 'bld' || role === 'bank') {
      var split = role === 'bank' ? 0 : Math.floor(R() * 4);
      var rects = split === 0 ? [[0, 0, 4, 4]] : split === 1 ? [[0, 0, 4, 2], [0, 2, 4, 2]] : split === 2 ? [[0, 0, 2, 4], [2, 0, 2, 4]] : [[0, 0, 2, 2], [2, 0, 2, 2], [0, 2, 2, 2], [2, 2, 2, 2]];
      rects.forEach(function (q) {
        buildings.push({ x: (ox + q[0]) * T, y: (oy + q[1]) * T, w: q[2] * T, h: q[3] * T, col: role === 'bank' ? '#b79b4a' : ROOFS[Math.floor(R() * ROOFS.length)], hgt: 8 + Math.floor(R() * 12), bank: role === 'bank', s: Math.floor(R() * 1000) });
        for (j = 0; j < q[3]; j++) for (i = 0; i < q[2]; i++) map[(oy + q[1] + j) * N + (ox + q[0] + i)] = G_BLD;
      });
      if (role === 'bank') { BANK.x = (ox + 2) * T; BANK.y = (by * 8 + 7.5) * T; }
    } else if (role === 'park') {
      for (j = 0; j < 4; j++) for (i = 0; i < 4; i++) map[(oy + j) * N + ox + i] = (R() < 0.28 && !((i === 1 || i === 2) && (j === 1 || j === 2))) ? G_TREE : G_GRASS;
    } else if (role === 'lot' || role === 'garage') {
      for (j = 0; j < 4; j++) for (i = 0; i < 4; i++) {
        map[(oy + j) * N + ox + i] = G_LOT;
        if (j === 0 || j === 3) lotSpots.push({ x: (ox + i + 0.5) * T, y: (oy + j + 0.5) * T, a: j === 0 ? Math.PI / 2 : -Math.PI / 2 });
      }
      if (role === 'garage') { GARAGE.x = (ox + 2) * T; GARAGE.y = (oy + 2) * T; }
    } else if (role === 'plaza') {
      if (bx === 3 && by === 3) { HOSPITAL.x = (ox + 2) * T; HOSPITAL.y = (oy + 2) * T; for (j = 0; j < 4; j++) for (i = 0; i < 4; i++) detail[(oy + j) * N + ox + i] = 255; }
    }
  }
  for (ty = 0; ty < N; ty++) for (tx = 0; tx < N; tx++) if (map[ty * N + tx] === G_WALK) walkSpots.push({ x: (tx + 0.5) * T, y: (ty + 0.5) * T });
}
genMap();

/* ---------- minicarte pré-rendue ---------- */
var mini = document.createElement('canvas'); mini.width = mini.height = N * 4;
(function () {
  var m = mini.getContext('2d');
  var col = { 0: '#2e3036', 1: '#8d8d88', 2: '#566379', 3: '#3d6b3a', 4: '#2f5a2f', 5: '#55575c' };
  for (var ty = 0; ty < N; ty++) for (var tx = 0; tx < N; tx++) { m.fillStyle = col[map[ty * N + tx]]; m.fillRect(tx * 4, ty * 4, 4, 4); }
  buildings.forEach(function (b) { if (b.bank) { m.fillStyle = '#e5c766'; m.fillRect(b.x / T * 4, b.y / T * 4, b.w / T * 4, b.h / T * 4); } });
  m.fillStyle = '#e6e6e6'; m.fillRect(HOSPITAL.x / T * 4 - 6, HOSPITAL.y / T * 4 - 2, 12, 4); m.fillRect(HOSPITAL.x / T * 4 - 2, HOSPITAL.y / T * 4 - 6, 4, 12);
  m.fillStyle = '#4cc9a0'; m.fillRect(GARAGE.x / T * 4 - 6, GARAGE.y / T * 4 - 6, 12, 12);
})();

/* ---------- état ---------- */
var state = 'menu';          // menu | play | pause | win
var cars = [], peds = [], pickups = [], phones = [], parts = [];
var P = { x: 0, y: 0, a: 0, vx: 0, vy: 0, hp: 100, money: 0, heat: 0, car: null, bust: 0, walk: 0, done: 0, tstart: 0 };
var mission = null, banner = null, overlay = null, hintT = 0;
var cam = { x: 0, y: 0, yaw: -Math.PI / 2, d: 190, h: 140, ahead: 60 };
var time = 0, GOAL = 25000;
var best = 0;
try { best = parseInt(localStorage.getItem('ruenoire-best') || '0', 10) || 0; } catch (e) {}

var CAR_TYPES = [
  { n: 'berline', len: 46, max: 215, acc: 260, cols: ['#c0392b', '#2e86c1', '#1e8449', '#7d3c98', '#b9770e', '#566573', '#f4f4f0'] },
  { n: 'citadine', len: 40, max: 195, acc: 280, cols: ['#f1c40f', '#e67e22', '#48c9b0', '#ec7063', '#85c1e9'] },
  { n: 'sport', len: 48, max: 285, acc: 340, cols: ['#d62828', '#111827', '#f77f00', '#0a9396'] },
  { n: 'camionnette', len: 58, max: 165, acc: 200, cols: ['#e5e5e5', '#8d99ae', '#6b705c', '#bc6c25'] }
];

function newCar(x, y, a, type, role) {
  var ct = type || pick(CAR_TYPES);
  return { x: x, y: y, a: a, vx: 0, vy: 0, w: 0, hp: 100, len: ct.len, max: ct.max, acc: ct.acc, col: pick(ct.cols), t: ct.n,
           role: role || 'civ', driver: role === 'parked' ? 'none' : 'ai', ai: { dir: Math.round(a / (Math.PI / 2)) & 3, node: '', cruise: rnd(105, 150), stuck: 0, rev: 0, mode: 'lane', blocked: 0 },
           dead: 0, smoke: 0, thr: 0, st: 0, br: 0, hitCool: 0 };
}

/* ---------- sons synthétisés ---------- */
var Snd = (function () {
  var ac = null, master = null, eng = null, sir = null, on = true, step = 0, mt = null, sirT = 0;
  try { on = localStorage.getItem('ruenoire-mute') !== '1'; } catch (e) {}
  function init() {
    if (ac) { try { ac.resume(); } catch (e) {} return; }
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = on ? 0.9 : 0; master.connect(ac.destination);
    var o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = 50; f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0;
    o.connect(f); f.connect(g); g.connect(master); o.start(); eng = { o: o, g: g, f: f };
    var so = ac.createOscillator(), sg = ac.createGain(); so.type = 'square'; so.frequency.value = 800; sg.gain.value = 0; so.connect(sg); sg.connect(master); so.start(); sir = { o: so, g: sg };
    startMusic();
  }
  function noise(dur, vol, freq) {
    if (!ac || !on) return; var n = ac.sampleRate * dur, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq || 900; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  function tone(f0, f1, dur, vol, type) {
    if (!ac || !on) return; var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  var BASS = [55, 0, 55, 82, 0, 73, 55, 0, 65, 0, 65, 98, 0, 87, 65, 0];
  function startMusic() {
    mt = setInterval(function () {
      if (!ac || !on || state !== 'play') return;
      var f = BASS[step % 16]; step++;
      if (f) { var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.type = 'square'; o.frequency.value = f; g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2); o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.22); }
      if (step % 2 === 0) noise(0.04, 0.025, 6000);
    }, 140);
  }
  return {
    init: init, noise: noise, tone: tone,
    isOn: function () { return on; },
    toggle: function () { on = !on; try { localStorage.setItem('ruenoire-mute', on ? '0' : '1'); } catch (e) {} if (master) master.gain.value = on ? 0.9 : 0; },
    update: function (speed, inCar, sirenVol) {
      if (!ac) return; var t = ac.currentTime;
      var gv = on && inCar && state === 'play' ? 0.05 + clamp(speed / 300, 0, 1) * 0.05 : 0;
      eng.g.gain.setTargetAtTime(gv, t, 0.08); eng.o.frequency.setTargetAtTime(38 + speed * 0.28, t, 0.08); eng.f.frequency.setTargetAtTime(300 + speed * 2, t, 0.1);
      var sv = on && state === 'play' ? sirenVol * 0.05 : 0; sir.g.gain.setTargetAtTime(sv, t, 0.1);
      if (sv > 0.001) { sirT += 1; sir.o.frequency.setTargetAtTime((Math.floor(time * 2.2) & 1) ? 920 : 690, t, 0.02); }
    },
    stop: function () { if (!ac) return; var t = ac.currentTime; eng.g.gain.setTargetAtTime(0, t, 0.05); sir.g.gain.setTargetAtTime(0, t, 0.05); }
  };
})();

/* ---------- entrées ---------- */
var keys = {}, stick = null, btns = {}, act = false, touchMode = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
var UI = {};
function layoutUI() {
  var m = Math.min(W, H);
  UI.act = { x: W - m * 0.2 - 10, y: H - m * 0.24, r: m * 0.11 };
  UI.brake = { x: W - m * 0.43, y: H - m * 0.14, r: m * 0.085 };
  UI.pause = { x: W - 24 - 112 - 36, y: 40, r: 22 };
  UI.sound = { x: W - 24 - 112 - 36, y: 92, r: 22 };
}
layoutUI(); window.addEventListener('resize', layoutUI);
function inCircle(c, x, y) { return dist(c.x, c.y, x, y) <= c.r * 1.25; }

function pdown(e) {
  e.preventDefault(); Snd.init();
  var rc = cv.getBoundingClientRect(), x = e.clientX - rc.left, y = e.clientY - rc.top;
  if (state === 'menu' || state === 'win' || state === 'pause') { menuClick(x, y); return; }
  if (inCircle(UI.pause, x, y)) { state = 'pause'; Snd.stop(); return; }
  if (inCircle(UI.sound, x, y)) { Snd.toggle(); return; }
  if (inCircle(UI.act, x, y)) { btns[e.pointerId] = 'act'; act = true; return; }
  if (inCircle(UI.brake, x, y)) { btns[e.pointerId] = 'brake'; return; }
  if (!stick && x < W * 0.6) { stick = { id: e.pointerId, x0: x, y0: y, x: x, y: y }; }
}
function pmove(e) { if (stick && stick.id === e.pointerId) { var rc = cv.getBoundingClientRect(); stick.x = e.clientX - rc.left; stick.y = e.clientY - rc.top; } }
function pup(e) { if (stick && stick.id === e.pointerId) stick = null; delete btns[e.pointerId]; }
cv.addEventListener('pointerdown', pdown); cv.addEventListener('pointermove', pmove);
cv.addEventListener('pointerup', pup); cv.addEventListener('pointercancel', pup);
window.addEventListener('keydown', function (e) {
  keys[e.code] = true; Snd.init();
  if (e.code === 'KeyE' || e.code === 'Enter') { if (state === 'menu') startGame(); else act = true; }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') { state = 'pause'; Snd.stop(); } else if (state === 'pause') state = 'play'; }
  if (e.code === 'KeyM') Snd.toggle();
  if (e.code.indexOf('Arrow') === 0 || e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; });
document.addEventListener('visibilitychange', function () { if (document.hidden && state === 'play') { state = 'pause'; Snd.stop(); } });

function getInput() {
  var inp = { mx: 0, my: 0, mag: 0, ang: 0, thr: 0, st: 0, brake: false, kb: false };
  var kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  var ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (kx || ky) { inp.kb = true; inp.thr = -ky; inp.st = kx; inp.mx = kx; inp.my = ky; var l = Math.hypot(kx, ky); inp.mx /= l; inp.my /= l; inp.mag = 1; inp.ang = Math.atan2(inp.my, inp.mx); }
  if (stick) {
    var dx = stick.x - stick.x0, dy = stick.y - stick.y0, d = Math.hypot(dx, dy), R = 60;
    var mag = clamp((d - 8) / (R - 8), 0, 1);
    if (mag > 0.05) { inp.mag = mag; inp.ang = Math.atan2(dy, dx); inp.mx = Math.cos(inp.ang); inp.my = Math.sin(inp.ang); inp.kb = false; }
  }
  if (inp.mag > 0 && !(inp.kb && P.car)) { var ra = inp.ang + cam.yaw + Math.PI / 2; inp.ang = ra; inp.mx = Math.cos(ra); inp.my = Math.sin(ra); }
  inp.brake = !!keys.Space;
  for (var k in btns) if (btns[k] === 'brake') inp.brake = true;
  return inp;
}

/* ---------- physique voitures ---------- */
function carShape(c) {
  var off = c.len / 2 - 12, cs = Math.cos(c.a), sn = Math.sin(c.a);
  return [[c.x - cs * off, c.y - sn * off], [c.x, c.y], [c.x + cs * off, c.y + sn * off]];
}
function driveCar(c, thr, st, brake, dt) {
  var fx = Math.cos(c.a), fy = Math.sin(c.a);
  var vf = c.vx * fx + c.vy * fy, vl = -c.vx * fy + c.vy * fx;
  var max = c.max * (c.role === 'cop' && c.ai.mode === 'chase' ? 1.04 : 1);
  if (c.dead) { thr = 0; brake = true; }
  if (thr > 0) { if (vf < max) vf += thr * c.acc * dt; }
  else if (thr < 0) { if (vf > 4) vf += thr * 420 * dt; else if (vf > -max * 0.4) vf += thr * c.acc * 0.6 * dt; }
  vf *= Math.exp(-0.55 * dt);
  if (brake) vf *= Math.exp(-3.2 * dt);
  vl *= Math.exp(-(brake ? 2.2 : 9) * dt);
  var turn = st * 2.5 * clamp(Math.abs(vf) / 80, 0, 1) / (1 + Math.abs(vf) / 380) * (vf >= 0 ? 1 : -1);
  c.a += (turn + c.w) * dt; c.w *= Math.exp(-5 * dt);
  fx = Math.cos(c.a); fy = Math.sin(c.a);
  c.vx = fx * vf - fy * vl; c.vy = fy * vf + fx * vl;
  c.x += c.vx * dt; c.y += c.vy * dt;
  c.speed = Math.abs(vf); c.vf = vf;
}
function pushCircle(px, py, r) {
  var tx0 = Math.floor((px - r) / T), tx1 = Math.floor((px + r) / T), ty0 = Math.floor((py - r) / T), ty1 = Math.floor((py + r) / T), best = null;
  for (var ty = ty0; ty <= ty1; ty++) for (var tx = tx0; tx <= tx1; tx++) {
    if (!solidTile(tileAt(tx, ty))) continue;
    var qx = clamp(px, tx * T, (tx + 1) * T), qy = clamp(py, ty * T, (ty + 1) * T);
    var dx = px - qx, dy = py - qy, d = Math.hypot(dx, dy);
    if (d < r) {
      var nx, ny, pen;
      if (d < 0.001) { dx = px - (tx + 0.5) * T; dy = py - (ty + 0.5) * T; var l = Math.hypot(dx, dy) || 1; nx = dx / l; ny = dy / l; pen = r; }
      else { nx = dx / d; ny = dy / d; pen = r - d; }
      if (!best || pen > best.pen) best = { nx: nx, ny: ny, pen: pen };
    }
  }
  return best;
}
function hurtPlayer(n) { if (n > 0 && state === 'play') { P.hp -= n; if (P.hp <= 0) knockOut(); } }
function carImpact(c, imp) {
  if (imp < 25) return;
  Snd.noise(0.18, clamp(imp / 300, 0.05, 0.4), 700);
  c.hp -= imp * 0.12;
  for (var i = 0; i < 4; i++) parts.push({ x: c.x, y: c.y, vx: rnd(-80, 80), vy: rnd(-80, 80), life: 0.4, max: 0.4, col: '#ffd166', size: 2 });
  if (c === P.car && c.hitCool <= 0) { hurtPlayer(imp * 0.06); c.hitCool = 0.25; }
  if (c.hp <= 0 && !c.dead) { c.dead = 1; c.burn = 0; if (c === P.car) { exitCar(true); } }
}
function collideCarWorld(c) {
  var sh = carShape(c);
  for (var i = 0; i < 3; i++) {
    var s = carShape(c)[i], hit = pushCircle(s[0], s[1], 12);
    if (hit) {
      c.x += hit.nx * hit.pen; c.y += hit.ny * hit.pen;
      var vn = c.vx * hit.nx + c.vy * hit.ny;
      if (vn < 0) { c.vx -= 1.35 * vn * hit.nx; c.vy -= 1.35 * vn * hit.ny; carImpact(c, -vn); c.w += (hit.nx * Math.sin(c.a) - hit.ny * Math.cos(c.a)) * -vn * 0.004 * (i === 0 ? -1 : i === 2 ? 1 : 0); }
    }
  }
}
function collideCars(a, b) {
  if (Math.abs(a.x - b.x) > 70 || Math.abs(a.y - b.y) > 70) return;
  var sa = carShape(a), sb = carShape(b);
